# Deploys FOOTBALL DRAFT to Cloudflare (decisions 31-34):
#   API   = Workers + D1 + Durable Objects  (apps/api, wrangler env staging / production)
#   game  = Cloudflare Pages                (apps/web)
#   admin = Cloudflare Pages                (apps/admin)
#
# - push to the development branch -> staging (automatic)
# - "Run workflow" (workflow_dispatch) -> staging or production
#   production waits for approval: GitHub > Settings > Environments > production > Required reviewers
#
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# The token never leaves GitHub; nothing here prints it.
name: Deploy

on:
  push:
    branches: [claude/amazing-lamport-vwkai8]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'assets/**'
      - 'data/**'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'staging or production (production needs approval)'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # A push before the Cloudflare secrets exist is skipped (not failed); a manual run fails with a message.
  secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then echo "ready=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >>"$GITHUB_OUTPUT"
          msg="Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub > Settings > Secrets and variables > Actions (repository secrets)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::Deploy skipped. $msg"

  deploy:
    needs: secrets
    if: needs.secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      url: ${{ steps.prepare.outputs.web_url }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test -w @fd/shared

      - name: Prepare Cloudflare resources (D1, Pages projects, URLs)
        id: prepare
        run: bash .github/scripts/cf-prepare.sh "$DEPLOY_ENV"

      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"

      - name: Deploy API worker
        working-directory: apps/api
        run: npx wrangler deploy --env "$DEPLOY_ENV" --var "ALLOWED_ORIGINS:${{ steps.prepare.outputs.web_url }},${{ steps.prepare.outputs.admin_url }}"

      - name: WebSocket ticket secret (generated once, kept afterwards)
        working-directory: apps/api
        run: |
          if npx wrangler secret list --env "$DEPLOY_ENV" | grep -q '"WS_TICKET_SECRET"'; then
            echo "WS_TICKET_SECRET already set"
          else
            openssl rand -hex 32 | npx wrangler secret put WS_TICKET_SECRET --env "$DEPLOY_ENV"
          fi

      - name: Build and deploy the game (Pages)
        env:
          VITE_API_URL: ${{ steps.prepare.outputs.api_url }}
        run: |
          npm run build -w @fd/web
          npx wrangler pages deploy apps/web/dist --project-name "${{ steps.prepare.outputs.web_project }}" --branch main --commit-dirty=true

      - name: Build and deploy the admin site (Pages)
        env:
          VITE_API_URL: ${{ steps.prepare.outputs.api_url }}
        run: |
          npm run build -w @fd/admin
          npx wrangler pages deploy apps/admin/dist --project-name "${{ steps.prepare.outputs.admin_project }}" --branch main --commit-dirty=true

      - name: Smoke test
        run: |
          api="${{ steps.prepare.outputs.api_url }}"
          web="${{ steps.prepare.outputs.web_url }}"
          for i in 1 2 3 4 5 6; do curl -fsS "$api/api/health" && break; sleep 5; done
          echo
          curl -fsS "$api/api/health" | grep -q '"ok":true'
          curl -fsS -o /dev/null "$web/"
          curl -fsS -o /dev/null "$web/cards/FD-001.png"
          # the game origin is allowed by CORS
          curl -fsS -o /dev/null -D - -X OPTIONS "$api/api/health" -H "Origin: $web" -H 'Access-Control-Request-Method: GET' | grep -qi "access-control-allow-origin: $web"

      - name: Summary
        if: always()
        run: |
          {
            echo "### FOOTBALL DRAFT ($DEPLOY_ENV)"
            echo "| | URL |"
            echo "| --- | --- |"
            echo "| game | ${{ steps.prepare.outputs.web_url }} |"
            echo "| admin | ${{ steps.prepare.outputs.admin_url }} |"
            echo "| API | ${{ steps.prepare.outputs.api_url }} |"
            echo "D1: football-draft-$DEPLOY_ENV (${{ steps.prepare.outputs.d1_id }})"
          } >>"$GITHUB_STEP_SUMMARY"
